        - generic [ref=e60]:
          - heading "既卒生の求人について" [level=2] [ref=e61]
          - paragraph [ref=e62]: 本校卒業生(既卒生)の求人も、随時受付しております。
          - paragraph [ref=e63]: 既卒生求人情報は、別途ホームページを作成し、卒業生(既卒生)に情報を提供しております。
          - link "卒業生情報ページ" [ref=e65] [cursor=pointer]:
            - /url: https://graduate.snm.ac.jp/hht/
            - img "卒業生情報ページ" [ref=e66]
          - paragraph [ref=e67]: 既卒生求人も、新卒生同様に求人票に必要事項を記入し、本校(キャリアセンター)に送付いただきたく存じます。求人票が到着次第、ホームページに既卒生求人情報として掲載させていただきます。
          - paragraph [ref=e68]: ＜既卒生求人に関するお願い＞
          - list [ref=e69]:
            - listitem [ref=e70]: 応募(問い合わせ)は、原則卒業生から直接連絡させていただきます。
            - listitem [ref=e71]: 御社企業名(病院名など)のホームページ掲載が可能であるか、求人票に掲載可否の記載をお願いします。(本校所定の求人票には確認欄がございます)
            - listitem [ref=e72]: 募集期間の記載をお願いします。(本校所定の求人票の場合は、備考欄に記載をお願いします) 例(随時募集、定員になり次第終了、12月15日までなど)
            - listitem [ref=e73]: 掲載期間は最長1年間とします。募集終了や掲載期間の延長は、キャリアセンターまで連絡いただきたく存じます。
          - link "電話でのお問い合わせはこちら 011-801-8343 札幌看護医療専門学校 キャリアセンター" [ref=e74] [cursor=pointer]:
