            - paragraph [ref=e187]:
              - text: 教科書・教材費：個人の教科書と教材にかかる費用です。
              - text: 資格検定費：各学科により異なります。資格検定費は受験予定資格分を納入いただきますが、未受験の場合の返金可能分については次年度学費へ振替（卒業年次は返金）させていただきます。
