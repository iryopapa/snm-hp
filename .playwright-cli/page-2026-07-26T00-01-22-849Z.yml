        - generic [ref=e199]:
          - heading "（5）様々な教育活動･教育環境" [level=2] [ref=e200]
          - generic [ref=e201]:
            - heading "教育関連イベント・学生支援システム" [level=3] [ref=e202]
            - heading "各種学生支援システム" [level=4] [ref=e203]
            - paragraph [ref=e204]:
              - strong [ref=e205]: 入学事前学習システム
              - text: 入学が決定した学生を対象に、入学をスムーズに学習を進められるよう各学科の内容に沿ったプログラムを用意しています。医療系の基礎知識となる生物や化学、解剖生理などの資料を送って自宅学習を可能にし、コンピューター上で動画のレクチャーやCBT（コンピューター上での模擬試験）なども受講することができます。高校で履修していない科目がある場合にも入学前にフォロー、基本的なスキルを統一して入学び備えます。
            - paragraph [ref=e206]:
              - link "入学予定者の皆さんへ E-ラーニング J-WEB" [ref=e207] [cursor=pointer]:
                - /url: http://jweb-pre.jgx.jp/
                - img "入学予定者の皆さんへ E-ラーニング J-WEB" [ref=e208]
            - paragraph [ref=e209]:
              - strong [ref=e210]: PC遠隔教育
              - text: 本校に入学する来年4月迄に、入学後の学習の理解を早める意味で自己学習教材を使っていただきます。この教材を使えば、自宅にいても学習を進めることができます。また、学習を進める上での疑問や質問は、本校の教員にメールやブログを使って質問をすることもできます。AOセミナー、オープンキャンパスなどで親しくなった友人との情報交換も可能です。
              - text: AO特待生入学事前学習eラーニングのメリットとして
            - list [ref=e211]:
              - listitem [ref=e212]: 自宅で時間にとらわれず学習ができる。
              - listitem [ref=e213]: 習熟度、到達点がリアルタイムに確認でき、学習意欲が向上する。
              - listitem [ref=e214]: 簡単なことでも不明点があれば気軽に質問し回答を得ることができる。
            - paragraph [ref=e215]:
              - strong [ref=e216]: 国家試験サポートシステム
              - text: 医療を目指す職業においては、国家資格なければその仕事をすることが出来ません。本校では、在学中に万が一、国家試験に不合格になった場合は、卒業後も次回試験に向けて合格をサポートするシステムを設けています。校内で行われる講習などに参加して指導を受けられるほか、本学園から教材を提供し、郵送での添削にも対応するなど、さまざまな試験対策を無償で行います。また、遠方の卒業生などのために学生寮を開放し、学習環境の面からもサポートします。
            - paragraph [ref=e217]:
              - strong [ref=e218]: 新入生研修システム
              - text: 合同の新入生研修を実施している。これは、医療人を目指す学生としての自覚を促がす内容の研修を行っています。また、将来、目指す業界の現場を見学する機械を設け、目的を確認し、これから学んでいく為の動機付けも図ります。
              - text: クラスや学科のチーム意識を高める為に、各学科で趣向を凝らしたグループワークが催され、3年後の国家試験合格と就職を目指して、有意義な学生生活を送るよう心構えを身につけさせる研修です。
            - paragraph [ref=e219]:
              - strong [ref=e220]: マナー教育システム
              - text: 挨拶運動
              - text: 教職員による朝の挨拶運動を実施しています。教職員全員が新入生を迎えるつもりで「おはようございます」の声掛けを行い、この時期に目的意識の確認、ルール、規律等を指導しています。
            - paragraph [ref=e221]:
              - strong [ref=e222]: 社会貢献システム
              - text: 本学園は、地域の方々から信頼を得ることを基本理念の一つにしています。この基本理念の実践として、社会貢献の機会を積極的に設け、学生たちは地域清掃などのボランティアや地域で行われるイベントなどに積極的に参加します。また、各専門分野の教員が講師役となって開催する一般市民を対象とした地域セミナーや社会貢献の役割を果たします。
            - paragraph [ref=e223]:
              - strong [ref=e224]: 同窓会勉強会システム
              - text: 学科ごとに同窓会を組織し、定期的に会合を行って親睦を図る一方で、それぞれの業界での真のリーダーになることを目的にした勉強会を行っています。各専門分野の知識・技術をさらに深める研修のほかに、業界の最新情報や求人に関する情報などを交換し合い、現場での仕事に活用しています。卒業生の活躍の場は全国各地に及んでいるため、参加できない同窓生にも情報を発信しようと、各学科で同窓会誌も発行しています。
