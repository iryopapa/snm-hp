        - generic [ref=e307]:
          - heading "（10）国際連携の状況" [level=2] [ref=e308]
          - paragraph [ref=e309]: 各学科の専門性を考慮した海外研修を行っています。自らが目指す世界の最先端に触れることにより、世界的視野を持った職業人の養成を目指しています。専門英語の学習のみならず日本人としてのアイデンティティの確立にも力を入れています。
          - generic [ref=e310]:
            - heading "海外研修" [level=3] [ref=e311]
            - heading "海外提携大学特別講演システム" [level=4] [ref=e312]
            - paragraph [ref=e313]: 本学園は、幅広い視野を持ったスペシャリストを育てる事を目標 に、海外の教育機関と提携して国際交流に力を入れています。その一環として、本学園と医療分野の教育を展開している提携大学から講師を招き、講演会･セミナーなどを開催して学生たちの興味や関心を広げています。海外の情報にふれる貴重な機会として、講演会には卒業生や地域の方々も参加可能していただいています。
            - heading "語学修得システム" [level=4] [ref=e314]
            - paragraph [ref=e315]: 授業以外にこれからの社会で活躍するための不可欠な語学の修得を支援する自由参加型のラーニングシステムです。各学科では必要とする専門英語やコミュニケーションとしての英語がカリキュラムに組み込まれており、業界で必要な英語力を修得します。
            - heading "海外留学支援システム" [level=4] [ref=e316]
            - paragraph [ref=e317]: 本学園が勧める国際交流の一環として、海外留学のシステムを用意しており、海外の提携大学への留学の道も開かれており、事前の情報提供や相談などにもキメ細かに対応するほか、短期または長期プログラムの場合も本学園に在学しながら留学することが可能です。
        - generic [ref=e318]:
          - heading "（11）その他" [level=2] [ref=e319]
          - heading "災害非常時の対応" [level=3] [ref=e320]
          - paragraph [ref=e321]: 平成23年3月11日の東日本大震災では、その後発生した巨大津波により、広い範囲で甚大な被害が発生した教訓から、学生並びに関係者に下記の対応マニュアルを作成、周知しています。
          - generic [ref=e322]:
            - heading "＜災害非常時マニュアル＞ 平成27年4月1日より運用" [level=4] [ref=e323]:
              - text: ＜災害非常時マニュアル＞
              - generic [ref=e324]: 平成27年4月1日より運用
            - paragraph [ref=e325]: 1 地震発生の場合
            - list [ref=e326]:
              - listitem [ref=e327]: 授業中の場合は、講師の指示に基づき、机の下等に身を寄せ、落下物から身を守ると共に使用中の火気器具などの始末を行い、出入り口を確保すること。
              - listitem [ref=e328]: 休憩中の場合は、周囲に落下物の無い場所で身を伏せ（ガラス戸棚・窓ガラス付近は避ける）、校内放送による指示を待つこと。
              - listitem [ref=e329]: 校舎外への避難開始は、周囲の状況にもよるが原則として、教職員からの指示に従い、揺れがおさまるまでそのまま待ち、落下物があるので慌てて外に飛び出さないこと。
            - paragraph [ref=e330]: 2 安否確認システムの登録について
            - paragraph [ref=e331]:
              - text: 学校所在地の都道府県で、震度5以上の地震が発生した場合、携帯メールで災害情報と共に無事を問い合わせるメールを配信します。この「安否確認システム」に返答することで、安否情報を確認します。
              - strong [ref=e332]: 全員必ず登録をして、安否確認メールが届いたら返信すること。
              - text: ※登録をすると、学校からの安否確認メールのほか、緊急連絡システムにも自動的に登録されます。
            - paragraph [ref=e333]: 3 火災発生の場合
            - list [ref=e334]:
              - listitem [ref=e335]: 使用中の教室で火災が発生した場合は、電気器具等の使用はすぐ中止する。
              - listitem [ref=e336]: 火災を発見したら、すぐ近くの火災報知機のベルを押すこと。
              - listitem [ref=e337]: 避難は非常放送及び教職員の指示に従って落ち着いて行動すること。
              - listitem [ref=e338]: 火災発生の場合は、すみやかに屋内、屋外の各非常階段から避難すること。
              - listitem [ref=e339]: 火災発生時は、エレベーターは絶対に使用しないこと。
            - paragraph [ref=e340]: 4 防災訓練・防災知識
            - paragraph [ref=e341]:
              - text: 学校では、定期的に防災訓練を実施しています。
              - text: 訓練の機会を通して防災意識を高め、将来仕事に就いた際には、プロとして人命を守る立場になることを意識してください。
              - text: 判断力や体力のある皆さんは、災害時に地域防災に貢献することもできます。卒業後の職場でもリーダーとして活躍が出来るようAEDの使用方法を身につける、防災士資格を取得するなど、より専門的な知識や技術を学ぶことにぜひチャレンジしてください。
            - list [ref=e342]:
