        - generic [ref=e185]:
          - heading "（4）キャリア教育・実践的職業教育" [level=2] [ref=e186]
          - generic [ref=e187]:
            - heading "キャリア教育への取り組み" [level=3] [ref=e188]
            - paragraph [ref=e189]: 本校の職業人教育は、知識と技術の習得に必要な『専門教育』と人を育てる『キャリア教育』を複合的に実践していきます。また、『国際教育』を通じて国際的視野と語学力を養い、グローバルに活躍できる人材を育成します。
            - paragraph [ref=e190]:
              - text: 職業人教育は「入学前」「在学中」「卒業後」とフロー形式で行います。
              - text: 自分が何を目指したいのか（＝自己発見）、そのために何をするか（＝自己変革）、目標を形にした後、そこからどうしたいのか（＝自己実現）。それぞれの段階で目的を見出し、学生たちは自分に必要な技術や知識の習得を目指します。
          - generic [ref=e192]:
            - heading "臨地実習の紹介" [level=3] [ref=e193]
            - paragraph [ref=e194]: 実際の仕事の現場を経験することができる臨地実習は、職業に対する意識を高め、自分の将来像をイメージする貴重な体験となります。本学園では、これまでに培った実績と信頼をもとに医療機関にご協力いただき、数多くの臨地実習を可能としています。
          - generic [ref=e195]:
