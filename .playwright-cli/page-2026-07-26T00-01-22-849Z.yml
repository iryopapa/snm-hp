          - heading "（6）学生の生活支援" [level=2] [ref=e267]
          - generic [ref=e268]:
            - heading "高等教育の修学支援制度" [level=3] [ref=e269]
            - paragraph [ref=e270]: 令和元年5月10日の「大学等における修学の支援に関する法律」の制定を受け、わが校では社会で自立し活躍することができる人材を育成するため経済的負担を軽減し、真に支援が必要な方への支援について積極的に取り組みを行います。
          - generic [ref=e271]:
            - heading "新入学生支援システム" [level=4] [ref=e272]
            - paragraph [ref=e273]: 一人暮らしを始めるためのマニュアル制作、周辺の地域から寄せられるアル バイト情報を発信するアルバイト支援デスクなど、多方面から学生の毎日をサポートするシステムを整備しています。さらに、学生生活のさまざまな悩みについて相談できる学生相談室を開設。臨床心理士の専門カウンセラーが来校し、相談者のプライバシーを最大限に尊重しながら、問題解決のためのアドバイスを行います。また、個別に将来の夢や学生生活での希望などを聞き、在学中に必要な全ての諸費用を学費相談員（ファイナンシャルアドバイザー）の見識から算出していきます。その上で、最も理想的な学費プランをご提案し、活用していただきます。心強い資金面のサポートとして、入学前は、もちろん、入学後も学費に関するアドバイスを行っていきます。
            - heading "健康管理システム" [level=4] [ref=e274]
            - paragraph [ref=e275]:
              - text: 学生の健康管理のために、年1回の健康診断4月上旬に実施しています。診断の結果、再検査を5月の下旬に実施し、その結果、要治療となった学生は、データをもとにスムーズに治療を受けることができます。
              - text: 再検査を、5月下旬に実施。（判定がDの項目のみ）
              - text: 検査項目は、以下の通り
              - text: 問診、身長、体重、BMI、血圧、視力、聴力、肝機能（BOT、GPT、γ-GTP）、脂質（総コレステロール、中性脂肪、HDLコレステロール）、
              - text: 尿検査（糖、蛋白、潜血、ウロビリノーゲン）、血液一般（赤血球数、ヘマトクリット、血色素量、白血球数、血小板数）、心電図、胸部Ｘ線
              - text: その他学科特性により臨床実習や就職のために追加検査を実施する
