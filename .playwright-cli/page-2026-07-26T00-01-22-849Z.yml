          - generic [ref=e82]:
            - heading "教育目標" [level=3] [ref=e83]
            - paragraph [ref=e84]:
              - text: 本校建学の精神は、本校教育の憲法とも言うべきもので、つぎの3本の柱で構成されています。
              - text: 第1は実学教育、第2は人間教育、第3は国際教育です。
              - text: 専門学校教育の使命は、3年の教育課程の中で、社会、産業構造の変革、進展に応じて要望される即戦力の人材を養成するもので、特徴として実習、校外研修を十分に取り入れた実践的な教育をすることが、第1の眼目です。しかし単に技術、知識に優れていても、日本人・社会人・業界人として、身構え・気構え・心構えを身につけた、心豊かな人材でなければ社会のニーズには応えられません。さらに時代が求める「国際化を意識した幅広い視野」を持ち得た人材育成のためにその一つの手段として、海外との学術交流・海外研修旅行など積極的に取り組んでいます。
              - text: 又、本校の卒業生は、医療業界という直接人間、健康、生命に直結する職業人となるわけですから、その重要性を十分自覚させ、患者さん中心の医療の提供と、信念のある人間に育てることを目標としています。
