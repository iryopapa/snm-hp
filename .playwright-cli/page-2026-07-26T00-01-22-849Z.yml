          - generic [ref=e154]:
            - heading "学校長 あいさつ" [level=3] [ref=e155]
            - generic [ref=e156]:
              - figure "学校法人 滋慶学園 札幌看護医療専門学校 学校長 佐々木 孝（ささき たかし）" [ref=e157]:
                - generic [ref=e158]:
                  - text: 学校法人 滋慶学園
                  - text: 札幌看護医療専門学校
                  - generic [ref=e159]: 学校長 佐々木 孝（ささき たかし）
              - paragraph [ref=e161]:
                - text: ＜プロフィール＞
                - text: 医師・医学博士
                - text: 日本胸部外科学会指導医、心臓血管外科名誉専門医、日本医師会認定産業医を歴任し、現役の医師として長年に渡り心臓血管外科や循環器医療に尽力しています。
            - paragraph [ref=e162]:
              - text: 札幌看護医療専門学校は、本校で学ぶ人々が医療人として求められる豊かな人間性を育み、将来の地域医療を支える人材となる能力を養うことを念頭に運営しております。
              - text: 医療の世界で仕事をしていくために大切なことは、人への思いやりですが、その心を育むために学内には「今日も笑顔であいさつを」の標語を掲げ人間教育を行なっています。
              - text: 本校の特長は先端医療機関との連携や地域との産官学連携を通して、ICTを駆使して現場に近い臨場感あふれる教育を実施していることです。
              - text: 私共はこのような環境で地域医療を支える人材育成を継続して行い、社会に貢献して参ります。
