          - generic [ref=e61]:
            - heading "開校の目的" [level=3] [ref=e62]
            - paragraph [ref=e63]: 本校は令和3年4月1日より実学教育・人間教育・国際教育を建学の理念に、業界と直結した職業教育を行うことを使命として開校致しました。
            - paragraph [ref=e64]: たえず時代の変化と社会のニーズを見つめながら、医療に関わる人材を養成し、人間教育として、キャリアに対する意識の形成や将来のキャリア設計をフローとしてとらえた「キャリア教育」、さらにグローバル人材の育成に力を注いでおり、常に社会から求められる高度医療専門職業人の育成のカリキュラムを目指しています。
            - paragraph [ref=e65]: また『4つの信頼』として掲げている「学生・保護者からの信頼」「高等学校からの信頼」「業界からの信頼」「地域からの信頼」を得ることを目指し、職業教育を通じて新たな知識・技術・人間性を創造し伝承・発展させ、人材を育成することを通じて社会の進歩と社会の発展に貢献するという使命をもっています。
            - heading "建学の理念" [level=4] [ref=e66]
            - paragraph [ref=e67]:
              - strong [ref=e68]: ①実学教育
              - text: スペシャリストの時代に即し、産業界に直結した専門学校として知識、技術、ビジネスマインドを持った業界が求める即戦力の人材を育成します。
            - paragraph [ref=e69]:
              - strong [ref=e70]: ②人間教育
              - text: 「今日も笑顔で挨拶を」を標語に掲げ、思いやりの気持ち、コミュニケーションの大切さを学び、自立した社会人としての人間力（身構え、気構え、心構え）を身につけます。
            - paragraph [ref=e71]:
              - strong [ref=e72]: ③国際教育
              - text: 日本人としてのアイデンティティを明確に持ち、価値観や文化の違いを尊重して、より広い視野でものを見ることができるよう、真の国際的な感性を養います。
          - generic [ref=e74]:
            - heading "建学の理念、沿革、学校長略歴・挨拶" [level=3] [ref=e75]
            - paragraph [ref=e76]:
