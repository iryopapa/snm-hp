          - paragraph [ref=e48]: 札幌看護医療では、高校生だけでなく様々な分野から医療職を目指す皆さんを募集しています。「医療現場で働いてるけど、もっとスキルアップしたい！」「大学に進学した後で目標がはっきりしたから今から実践的に学びたい！」「医療の国家資格を取得して安定した仕事がしたい！」「一般企業に就職したけど、幼い時の夢を叶えたい！」など、さまざまな理由で医療職を目指す方は年々増えています。札幌看護医療は、再進学をサポートし、新たなチャレンジを志す皆さんを応援しています。年齢などは気にせず、まずは一度、お気軽にご相談ください。
