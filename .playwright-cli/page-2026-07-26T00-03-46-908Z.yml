                - paragraph [ref=e187]:
                  - text: 専門学校を卒業し、介護老人保健施設で働いていました。そのうちに海外へ行きたくなり、英語の勉強をし、お金を貯め、フィリピンとカナダに留学しました。
                  - text: 帰国後は、出産を経て、シングルマザーで子育てをしながら英会話講師の仕事と、グループホームで介護の仕事を掛け持ちしていました。
              - generic [ref=e188]:
                - paragraph [ref=e189]: ● 看護師になりたいと思ったキッカケ
                - paragraph [ref=e190]:
                  - text: 幼い頃に見たテレビドラマに影響を受け、看護師という職業に憧れをずっと持っていました。留学していたフィリピンでストリートチルドレンを目の当たりにし、その実態と数の多さに衝撃を受けましたが、当時は何も出来ず、ひたすら無力さを感じていました。
                  - text: その後、自分の子供を産んだ時に、フィリピンの子供たちのことを思い出し、自分に何が出来るのか考えた結果、看護師になってフィリピンに戻り、子供達のケアに携わりたいと思ったのがキッカケです。
              - generic [ref=e191]:
                - paragraph [ref=e192]: ● 札幌看護医療に進学した理由
                - paragraph [ref=e193]: 他の学校は、実習中に担当の先生が、病院にたまに顔を出したり、様子を見にきてくれたりしますが、札幌看護医療は、学生4人と教員1人がひとつのチームとなり、実習中は担当の先生が、ずっと病院にいてくれるため、手厚い指導を受けられ、より学びが深まると思い、札幌看護医療を選びました。
