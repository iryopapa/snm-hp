      - heading "SOCIAL POLICY ソーシャルメディア ポリシー" [level=1] [ref=e24]:
        - generic [ref=e25]:
          - generic [ref=e26]: SOCIAL POLICY
          - generic [ref=e27]:
            - text: ソーシャルメディア
            - generic [ref=e28]: ポリシー
      - generic [ref=e29]:
        - paragraph [ref=e31]:
          - text: 本学では「実学教育、キャリア教育」の一環として、ITを活用する上で必要な知識やモラルを学ぶ「IT・リテラシー教育」に力を注いでいます。そこでソーシャルメディアを通じて、積極的かつ安全・快適に皆様とコミュニケーションを図るために、「ソーシャルメディアポリシー」を策定しました。
          - text: このガイドラインは、本学の学生・教職員を対象にソーシャルメディアに関わるための基本マナーを記載したものです。また本学が提供致しますソーシャルメディアを利用いただく皆様も、本メディアポリシーをご確認のうえ、遵守くださいますようお願いいたします。
        - generic [ref=e32]:
          - heading "1.本学のソーシャルメディアの定義" [level=2] [ref=e33]
          - paragraph [ref=e34]: ソーシャルメディアとは、人と人とのつながりを促進・サポートする、コミュニティー型のサービスを提供するWebサイトのことを示します。（Twitter、Facebook、LINE、mixi、ブログ、電子掲示板など）
          - list [ref=e35]:
            - listitem [ref=e36]: ※ このポリシーで定めるソーシャルメディアは、技術の進化に伴い新たに生み出されたメディアも含みます。
        - generic [ref=e37]:
          - heading "2.公式ソーシャルメディア運用について" [level=2] [ref=e38]
          - paragraph [ref=e39]:
            - text: 本学のソーシャルメディアにおける情報発信は、本学が認めた者がソーシャルメディアポリシーに則り「公式アカウントID」において運用いたしております。
            - text: 本学ソーシャルメディア公式アカウント（以下公式アカウント）は以下となります。
          - heading "LINE" [level=3] [ref=e40]
          - paragraph [ref=e41]:
            - link "URL：https://lin.ee/kxlpB4B" [ref=e42] [cursor=pointer]:
              - /url: https://lin.ee/kxlpB4B
          - heading "Instagram" [level=3] [ref=e43]
