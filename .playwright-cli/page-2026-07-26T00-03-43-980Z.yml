            - listitem [ref=e53]:
              - text: 学スタBlog
              - link "URL：http://ameblo.jp/hhteco/" [ref=e54] [cursor=pointer]:
                - /url: http://ameblo.jp/hhteco/
          - list [ref=e55]:
            - listitem [ref=e56]: ※ 本サービスに対する投稿などに対しては、返答できない場合があります。また公式アカウントの対応時間は、業務時間内といたします。
        - generic [ref=e57]:
          - heading "3.情報発信に際しての遵守事項" [level=2] [ref=e58]
          - paragraph [ref=e59]:
            - text: 本学公式ソーシャルメディアのご利用に際し、以下の情報を発信してはならないものとします。
            - text: 健全な運用のために、下記に挙げた情報を発見した際には、発信者の承諾を得ずに削除する場合があります。
          - list [ref=e60]:
            - listitem [ref=e61]: 公序良俗または法令に反する情報、またはそのおそれのある情報。
            - listitem [ref=e62]: 有害、わいせつ、暴力的な情報、またはそれらの描写が含まれる情報。
            - listitem [ref=e63]: 犯罪行為に結びつく情報、またはそのおそれのある情報。
            - listitem [ref=e64]: 本学、他利用者、第三者の権利および財産を侵害する情報、またはそのおそれのある情報。
            - listitem [ref=e65]: 本学、他利用者、第三者を誹謗中傷する情報。
            - listitem [ref=e66]: 本サービスの運営を妨げる情報、または本学の信用を毀損する情報。
            - listitem [ref=e67]: 他利用者、第三者に対し、氏名・電話番号・住所などの個人情報を本人の許可なく掲載するなど、プライバシーを侵害する情報。
            - listitem [ref=e68]: 著作権をはじめとする知的財産権を侵害、またはそのおそれのある情報。
            - listitem [ref=e69]: その他 本学が公式ソーシャルメディアへの掲載が不適切であると判断する情報。
        - generic [ref=e70]:
          - heading "4.個人がソーシャルメディアを利用する際の注意事項" [level=2] [ref=e71]
          - paragraph [ref=e72]: 本学教職員、または関係者が公式ソーシャルメディアを通じて情報を発信する際、以下に掲げる原則を基本姿勢とします。
          - list [ref=e73]:
            - listitem [ref=e74]: 本学の教職員であるという自覚を持ち、誠実で正直なコミュニケーションを行います。
            - listitem [ref=e75]: 学内規則や法令等を遵守し、各サービスの利用規約を良く読み、内容を理解した上で利用します。
            - listitem [ref=e76]: 一度公開した情報は、完全に削除できないことを理解し、言動に責任を持ち閲覧者に誤解を与えないよう、良識ある発言・投稿を心がけます。
            - listitem [ref=e77]: 伝聞や推測に基づく不確かな情報ではなく、正確な情報発信を心がけます。
            - listitem [ref=e78]: 守秘義務を守り、一般に公開されていない情報（メールアドレス・電話番号などの個人情報、企業等の機密事項など）は公開いたしません。
        - generic [ref=e79]:
          - heading "5.ソーシャルメディアをご利用の皆様へ" [level=2] [ref=e80]
          - paragraph [ref=e81]:
            - text: ソーシャルメディアにおいて、本学教職員および関係者が発信した情報であっても、必ずしも公式発表や見解を表しているものではございませんので、あらかじめご了承ください。また、利用者から発信された情報についても、必ずしも公式発表や見解をあらわしているものではございません。
            - text: 正式な発表・見解につきましては、公式ウェブサイトで発信する各種ニュースリリースをご確認ください。
          - list [ref=e82]:
            - listitem [ref=e83]: ※ ソーシャルメディアの中には類似するアカウントも存在しますが、第三者が管理・運営をしている場合がございますので、ご注意ください。
          - paragraph [ref=e84]:
            - text: 本学の公式ソーシャルメディアに関するお問い合わせは、
            - link "こちら" [ref=e85] [cursor=pointer]:
              - /url: https://www.snm.ac.jp/inquiry/
            - text: までお寄せください。
        - generic [ref=e86]:
          - heading "6.ソーシャルメディアポリシーの更新" [level=2] [ref=e87]
          - paragraph [ref=e88]:
            - text: 本ポリシーは、ソーシャルメディアの進化にあわせ、更新することがあります。
            - text: 変更したポリシーは、サイト上に掲載・表示した時点で、すべての利用者に適用されます。
