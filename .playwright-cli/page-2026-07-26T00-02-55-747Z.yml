              - paragraph [ref=e359]: 眼科で、患者さんの視力や眼圧などさまざまな検査を行っています。眼鏡合わせでは、患者さんが不便に感じているところなど、一人ひとりの思いをくみ取りながら調整し、度数を合わせます。「今までよりも見やすくなった」と笑顔で言われた時に、やりがいを感じます。
            - group "4 / 6" [ref=e360]:
              - paragraph [ref=e361]:
                - img "大学病院で働く" [ref=e362]
              - paragraph [ref=e363]
              - paragraph [ref=e364]: 西山さん 国立大学法人北海道大学 北海道大学病院 勤務（札幌第一高校出身）
              - paragraph [ref=e365]: 視能訓練士の主任として、部下の統括管理業務や大学病院ならではの臨床研究活動も行います。研究で得られた結果を患者さんに還元し、役に立てた時に喜びを感じます。
            - group "5 / 6" [ref=e366]:
              - paragraph [ref=e367]:
                - img "大学病院で働く" [ref=e368]
              - paragraph [ref=e369]
              - paragraph [ref=e370]: 福田さん 国立大学法人北海道大学 北海道大学病院 勤務（帯広南商業高校出身）
              - paragraph [ref=e371]: 重い疾患や珍しい症例の患者さんと関わることも多く、医師の診断に必要な血管や臓器の状態を見る精密な検査も行います。職場には、正確で迅速な検査を行うスキルの高い先輩がたくさんいます。尊敬できる人たちがいる現場で、目の健康を支えるこの仕事に誇りを持って働いています。
            - group "6 / 6" [ref=e372]:
              - paragraph [ref=e373]:
                - img "クリニックで働く" [ref=e374]
              - paragraph [ref=e375]
              - paragraph [ref=e376]: 多治見さん 医療法人社団翔勇会 まつお眼科 勤務（恵庭北高校出身）
              - paragraph [ref=e377]: 視機能の改善を通じて生活の質向上に貢献できることに、大きなやりがいを感じています。眼鏡調整で患者さんが視界の鮮明さに感動される瞬間や、子どもたちの成長を間近で見守れることが何よりの喜びです。最新機器の導入も糧に知識を深め、幅広い世代に寄り添う姿勢を大切にしています。
