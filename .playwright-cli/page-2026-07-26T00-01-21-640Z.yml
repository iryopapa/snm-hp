      - heading "ABOUT 建学の理念" [level=1] [ref=e25]:
        - generic [ref=e26]: ABOUT
        - generic [ref=e27]: 建学の理念
      - generic [ref=e29]:
        - generic [ref=e30]:
          - paragraph [ref=e31]:
            - text: 札幌看護医療専門学校は
            - generic [ref=e32]: 職業人教育を通して
            - generic [ref=e33]: 社会に貢献します
          - paragraph [ref=e34]: 札幌看護医療専門学校開校は、全国に81の教育機関を展開する滋慶学園グループを母体組織として、「職業教育を通じて社会に貢献する」ことをミッションに掲げ、「建学の理念」と「4つの信頼」を大切に、学生の夢をかなえるサポートに取り組んでいます。
        - heading "建学の理念" [level=2] [ref=e35]
        - heading "学校長 あいさつ" [level=3] [ref=e36]
        - generic [ref=e37]:
          - figure "学校法人 滋慶学園 札幌看護医療専門学校 学校長 佐々木 孝（ささき たかし）" [ref=e38]:
            - generic [ref=e39]:
              - text: 学校法人 滋慶学園
              - text: 札幌看護医療専門学校
              - generic [ref=e40]: 学校長 佐々木 孝（ささき たかし）
          - paragraph [ref=e42]:
            - text: ＜プロフィール＞
            - text: 医師・医学博士
            - text: 日本胸部外科学会指導医、心臓血管外科名誉専門医、日本医師会認定産業医を歴任し、現役の医師として長年に渡り心臓血管外科や循環器医療に尽力しています。
        - paragraph [ref=e43]:
          - text: 札幌看護医療専門学校は、本校で学ぶ人々が医療人として求められる豊かな人間性を育み、将来の地域医療を支える人材となる能力を養うことを念頭に運営しております。
          - text: 医療の世界で仕事をしていくために大切なことは、人への思いやりですが、その心を育むために学内には「今日も笑顔であいさつを」の標語を掲げ人間教育を行なっています。
          - text: 本校の特長は先端医療機関との連携や地域との産官学連携を通して、ICTを駆使して現場に近い臨場感あふれる教育を実施していることです。
          - text: 私共はこのような環境で地域医療を支える人材育成を継続して行い、社会に貢献して参ります。
      - generic [ref=e44]:
        - heading "3つの建学の理念" [level=3] [ref=e45]
        - paragraph [ref=e46]: 3つの教育を通して、各業界で即戦力として活躍できる人材を育成しています。
        - generic [ref=e47]:
          - generic [ref=e48]:
            - term [ref=e49]: 実学教育
            - definition [ref=e50]: スペシャリストの時代に即し、産業界に直結した専門学校として知識、技術、ビジネスマインドを持った業界が求める即戦力の人材を育成します。
          - generic [ref=e51]:
            - term [ref=e52]: 国際教育
            - definition [ref=e53]: 日本人としてのアイデンティティを明確に持ち、価値観や文化の違いを尊重して、より広い視野でものを見ることができるよう、真の国際的な感性を養います。
          - generic [ref=e54]:
            - term [ref=e55]: 人間教育
            - definition [ref=e56]: 「今日も笑顔で挨拶を」を標語に掲げ、思いやりの気持ち、コミュニケーションの大切さを学び、自立した社会人としての人間力（身構え、気構え、心構え）を身につけます。
      - generic [ref=e58]:
        - heading "4つの信頼" [level=3] [ref=e59]
        - paragraph [ref=e60]: 4つの信頼を得ることを目指して日々、教育に取り組んでいます。
        - list [ref=e61]:
          - listitem [ref=e62]:
            - paragraph [ref=e63]: "01"
            - heading "学生・保護者からの信頼" [level=4] [ref=e64]
            - paragraph [ref=e65]: 目指す業界への国家試験や就職試験などのハードルを越え、それぞれの夢の実現を確実にサポートすることで、学生・保護者から信頼される学園を常に目指します。
          - listitem [ref=e66]:
            - paragraph [ref=e67]: "02"
            - heading "高等学校からの信頼" [level=4] [ref=e68]
            - paragraph [ref=e69]: この業界でこの仕事を目指すなら本学園と勧めてもらえるように、就職などの確かな実績を築くことで、高等学校の先生から信頼される学園を常に目指します。
          - listitem [ref=e70]:
            - paragraph [ref=e71]: "03"
            - heading "業界からの信頼" [level=4] [ref=e72]
            - paragraph [ref=e73]: 業界が望む技術、知識、マナーなどの習得と必要な国家資格の100%合格を目標に、即戦力となる人材を育成することで、各業界から信頼される学園を常に目指します。
          - listitem [ref=e74]:
            - paragraph [ref=e75]: "04"
            - heading "地域からの信頼" [level=4] [ref=e76]
            - paragraph [ref=e77]: 日頃の学生・教職員の活動や態度を通して地域に受け入れられ、地域密着の学園づくりをすることで、地域の方々と産業界から信頼される学園を常に目指します。
